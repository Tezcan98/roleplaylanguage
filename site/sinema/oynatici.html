<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Türk Ailem · Sinema</title>
<meta name="robots" content="noindex">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p{position:absolute;inset:0;width:100%;height:100%}</style>
</head><body>
<div id="p"></div>
<script>
/*
 * The game's open-air cinema (web/src/systems/Cinema.js) plays short clips of cartoons from their
 * official YouTube channels through this page, in an iframe over the cinema's screen. The game app's
 * own pages come from https://localhost, which YouTube's embedded player refuses (error 152/153), so
 * the player is embedded here, on our own site, with YouTube's official IFrame API.
 * Messages from the game: { type: 'clip', id, start, end, rate } plays seconds start–end of video
 * `id`; { type: 'stop' }. To the game: { type: 'ready' | 'playing' | 'ended' | 'error', code? }.
 */
var player = null, ready = false, want = null, timer = 0, parentOrigin = '*';
function tell(m) { parent.postMessage(Object.assign({ cinema: true }, m), parentOrigin); }
function watch(c) {
  clearInterval(timer);
  timer = setInterval(function () {
    if (!player || !player.getCurrentTime) return;
    if (player.getCurrentTime() >= c.end - 0.05) { clearInterval(timer); player.pauseVideo(); tell({ type: 'ended' }); }
  }, 80);
}
function play(c) {
  want = c;
  if (!ready) return;
  player.loadVideoById({ videoId: c.id, startSeconds: c.start, endSeconds: c.end + 0.4 });
  player.setPlaybackRate(c.rate || 1);
  watch(c);
}
addEventListener('message', function (e) {
  var m = e.data;
  if (!m || typeof m !== 'object') return;
  if (m.type === 'clip' && /^[\w-]{11}$/.test(m.id) && isFinite(m.start) && isFinite(m.end)) { parentOrigin = e.origin || '*'; play({ id: m.id, start: +m.start, end: +m.end, rate: +m.rate || 1 }); }
  else if (m.type === 'stop' && player && player.pauseVideo) { clearInterval(timer); player.pauseVideo(); }
});
window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player('p', {
    width: '100%', height: '100%',
    playerVars: { controls: 0, disablekb: 1, fs: 0, rel: 0, playsinline: 1, iv_load_policy: 3, cc_load_policy: 0, hl: 'tr', origin: location.origin },
    events: {
      onReady: function () { ready = true; tell({ type: 'ready' }); if (want) play(want); },
      onStateChange: function (e) { if (e.data === 1) tell({ type: 'playing' }); if (e.data === 0) { clearInterval(timer); tell({ type: 'ended' }); } },
      onError: function (e) { tell({ type: 'error', code: e.data }); },
    },
  });
};
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body></html>
