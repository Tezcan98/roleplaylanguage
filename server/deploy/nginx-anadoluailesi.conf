# Anadolu Ailesi on anadoluailesi.com.tr (Cloudflare proxied → this server; the firewall lets only Cloudflare in on 80/443).
# Installed on the server as /etc/nginx/sites-available/anadoluailesi.com.tr by tools/move-to-anadoluailesi.sh (once).
# One address for both: the promo site (/) and the game server (/ws/village, /health, /api/…) → yilmaz-village on 127.0.0.1:8097.
# Certificate: self-signed, for Cloudflare SSL mode "Full" (a Cloudflare Origin Certificate can replace it).
# A file of its own: no other site on this server is touched.
server {
    listen 80; listen [::]:80;
    listen 443 ssl; listen [::]:443 ssl;
    server_name anadoluailesi.com.tr www.anadoluailesi.com.tr sehem2.com.tr www.sehem2.com.tr; # sehem2.com.tr: only an old name, for the apps already out (they ask it for their updates)
    if ($http_cf_visitor ~ "\"scheme\":\"http\"") { return 301 https://$host$request_uri; } # a visitor on http:// (Cloudflare tells us): to https://
    ssl_certificate     /etc/ssl/anadoluailesi/cert.pem;
    ssl_certificate_key /etc/ssl/anadoluailesi/key.pem;

    # the game server
    location /ws/village {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_read_timeout 120s;
    }
    location = /health { proxy_pass http://127.0.0.1:8097; }
    location /api/tts { proxy_pass http://127.0.0.1:8097; proxy_set_header X-Forwarded-For $http_cf_connecting_ip; proxy_read_timeout 30s; }
    location ~ ^/api/ad-(event|stats)$ { proxy_pass http://127.0.0.1:8097; proxy_set_header X-Forwarded-For $http_cf_connecting_ip; proxy_set_header X-Country $http_cf_ipcountry; client_max_body_size 2k; } # live ad numbers (AdStats.js)
    location ~ ^/api/(play-event|stats)$ { proxy_pass http://127.0.0.1:8097; proxy_set_header X-Forwarded-For $http_cf_connecting_ip; client_max_body_size 4k; } # anonymous play numbers (PlayStats.js)
    location /api/npc-chat { proxy_pass http://127.0.0.1:8097; proxy_set_header X-Forwarded-For $http_cf_connecting_ip; client_max_body_size 16k; proxy_read_timeout 30s; }
    location ~ ^/api/feedback(-list)?$ { proxy_pass http://127.0.0.1:8097; proxy_set_header X-Forwarded-For $http_cf_connecting_ip; client_max_body_size 16k; proxy_read_timeout 30s; } # the players feedback, graded for credits (Feedback.js)
    location ~ ^/api/report(s|-action)$ { proxy_pass http://127.0.0.1:8097; proxy_set_header X-Forwarded-For $http_cf_connecting_ip; client_max_body_size 16k; proxy_read_timeout 30s; } # player reports, the operator decides (Reports.js)

    # the game, one copy for every language of the meanings: /oyun/en/… serves /oyun/… (the game reads the language from the address)
    location = /oyun { return 301 /oyun/; }
    location ~ ^/oyun/(tr|en|ar|ur|es|fr)$ { return 301 /oyun/$1/; }
    location ~ ^/oyun/(?:tr|en|ar|ur|es|fr)/ {
        rewrite ^/oyun/(?:tr|en|ar|ur|es|fr)/(.*)$ /oyun/$1 last; # inside the server only: the address bar keeps /oyun/en/
    }
    location /oyun/ {
        location /oyun/bundle/ { expires 30d; add_header Cache-Control "public, immutable"; }
        # models, textures, sounds, meanings: Cloudflare's edge and the browser keep them 10 minutes, then
        # check again in the background (a deploy shows up within minutes; most players never wait for the server)
        location /oyun/assets/ { add_header Cache-Control "public, max-age=600, stale-while-revalidate=86400"; try_files $uri =404; }
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /oyun/index.html;
    }

    # the promo site
    root /var/www/anadoluailesi.com.tr;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location /assets/ { expires 7d; add_header Cache-Control "public"; }
    gzip on; gzip_types text/css application/javascript image/svg+xml application/json;
}
