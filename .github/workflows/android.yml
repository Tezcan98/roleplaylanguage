name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [feature/android]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install npm dependencies
        run: npm install
      - name: Validate content
        run: npm run check
      - name: Build web bundle
        run: npm run build
      - name: Add Capacitor Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('<manifest ', '<manifest ', 1)
          if 'android.permission.INTERNET' not in s:
              s = s.replace('</manifest>', '  <uses-permission android:name="android.permission.INTERNET" />\\n  <uses-permission android:name="android.permission.RECORD_AUDIO" />\\n</manifest>')
          s = s.replace('</application>', '    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />\\n  </application>')
          s = s.replace('android:launchMode="singleTask"', 'android:launchMode="singleTask" android:screenOrientation="sensorLandscape"')
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yilmaz-ailesi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
